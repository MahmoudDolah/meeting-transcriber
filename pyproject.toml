[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeting-transcriber"
version = "0.1.0"
description = "Local, offline meeting recorder and transcriber (mic + system audio, Me/Others labels)"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0",
    "click>=8.1",
    "pyobjc-framework-CoreAudio>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
meeting-transcriber = "meeting_transcriber.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_transcriber"]
